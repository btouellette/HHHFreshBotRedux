services:
  # Node app. Docker Compose builds this container from the Dockerfile in
  # this directory. A cron job inside the container runs `node app.js` hourly
  # (see crontab/root).
  app:
    build: .
    env_file:
      - .env
    environment:
      # Daily and weekly roundup day boundaries are computed in UTC.
      - TZ=UTC
    depends_on:
      # Our app does not work without our database
      # so this ensures our database is loaded first
      - postgres
    restart: always
    volumes:
      # Maps our current project directory `.` to
      # our working directory in the container
      - ./:/usr/src/app/
      # node_modules workaround for volumes
      # https://stackoverflow.com/a/32785014
      - /usr/src/app/node_modules
    command: "/usr/sbin/crond -f -l 8 -L /dev/stdout"
    #command: "node /usr/src/app/app.js"

  # PostgreSQL database. The app creates its own schema on first run
  # (CREATE TABLE IF NOT EXISTS ...), so no seed file is required.
  postgres:
    image: postgres:14.1-alpine
    restart: always
    env_file:
      - .env
    # Uncomment to reach the database from the host, e.g. with a GUI client.
    #ports:
    #  - "5432:5432"
    volumes:
      # Named volume so the data survives `docker compose down` and
      # container recreation.
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
